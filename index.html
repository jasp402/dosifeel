async function logout(){await action(async()=>{await api('logout',{});S.user=null;authView()})}
async function load(){try{S.user=(await api('me')).user;if(S.user.role==='seller'){const [catalog,clients]=await Promise.all([api('catalog'),api('clients')]);S.products=catalog.products;S.clients=clients.clients;S.stock=clients.stock;S.tab='clients'}else{const [catalog,dash]=await Promise.all([api('catalog'),api('dashboard')]);S.products=catalog.products;S.assignments=dash.assignments;S.events=dash.events;S.tab='home'}render()}catch(e){if(e.message.includes('Inicia sesión')||e.message.includes('Sesión inválida'))return authView();shell('<div class="card"><h2>No se pudo conectar</h2><p>'+esc(e.message)+'</p><button class="btn" onclick="load()">Reintentar</button></div>')}}

function render(){shell(menu()+(S.user.role==='seller'?({clients:sellerView,catalog:catalogView,settings:settingsView}[S.tab]||sellerView)():({home:homeView,calendar:calendarView,catalog:catalogView,achievements:achievementView,settings:settingsView}[S.tab]||homeView)()));motionIn();}
const today=()=>new Date().toLocaleDateString('en-CA'),weekday=day=>new Date(day+'T12:00:00').getDay();
function dayEvents(day){return S.events.filter(e=>e.day===day)}
function planned(day){let rows=[];for(const a of S.assignments){if(!a.enabled||Number(a.inventory)<=0&&!S.events.some(e=>e.assignment_id===a.id&&e.day===day))continue;if(!(a.daily_days||[]).includes(weekday(day)))continue;for(const time of a.times||[]){const event=S.events.find(e=>e.assignment_id===a.id&&e.day===day&&e.scheduled===time);rows.push({...a,time,event})}}return rows.sort((x,y)=>x.time.localeCompare(y.time))}
function state(day){let rows=planned(day);if(!rows.length)return 'neutral';let done=rows.filter(x=>x.event?.status==='taken').length;if(done===rows.length)return'full';if(done)return'partial';if(day>today())return'neutral';if(day===today())return 'pending';return'empty'}
function star(s){return s==='full'?'★':s==='partial'?'◐':s==='empty'?'☆':s==='pending'?'·':'–'}
function percent(rows){if(!rows.length)return 0;return Math.round(rows.filter(x=>x.event?.status==='taken').length/rows.length*100)}
function stockInfo(a){let units=Number(a.inventory),daily=(a.times||[]).length*Number(a.servings)*((a.daily_days||[]).length/7);return daily>0?Math.ceil(units/daily):null}
function msg(product,type){let text=type==='restock'?'Hola, soy '+S.user.name+' ('+S.user.email+'). Quisiera coordinar la reposición de '+product+'.':'Hola, soy '+S.user.name+' ('+S.user.email+'). Actualmente uso '+product+' y quisiera consultar otros productos disponibles.';window.open('https://wa.me/?text='+encodeURIComponent(text),'_blank','noopener')}

function sellerView(){const active=S.clients.filter(c=>c.active);const pending=S.clients.filter(c=>!c.active);const alerts=S.stock.filter(a=>{let daily=a.times.length*Number(a.servings)*(a.daily_days.length/7);return daily>0&&Number(a.inventory)/daily<=3});return '<div class="eyebrow">PANEL DE LA VENDEDORA</div><h1>Tu cartera de clientes</h1><div class="grid3" style="margin:19px 0"><div class="card"><div class="tag">Clientes activos</div><div class="stat">'+active.length+'</div></div><div class="card"><div class="tag">Por activar</div><div class="stat">'+pending.length+'</div></div><div class="card"><div class="tag">Reposiciones próximas</div><div class="stat">'+alerts.length+'</div></div></div><div class="grid"><div class="card"><h2>Activar cliente</h2><form class="form" id="activate"><label class="field">Correo del cliente<input type="email" name="email" required placeholder="cliente@correo.com"></label><button class="btn">Activar por correo</button></form></div><div class="card"><h2>Registrar venta o reposición</h2><form class="form" id="assign"><label class="field">Cliente activo<select name="user" required><option value="">Selecciona un cliente</option>'+active.map(c=>'<option value="'+c.id+'">'+esc(c.name)+' · '+esc(c.email)+'</option>').join('')+'</select></label><label class="field">Producto<select name="product" required><option value="">Selecciona un producto</option>'+S.products.map(p=>'<option value="'+p.id+'">'+esc(p.name)+'</option>').join('')+'</select></label><label class="field">Cantidad entregada<input name="quantity" type="number" step=".25" min=".25" required></label><button class="btn">Registrar inventario</button></form></div></div><div class="card" style="margin-top:18px"><h2>Clientes registrados</h2>'+(S.clients.length?S.clients.map(c=>'<div class="record"><div class="grow"><strong>'+esc(c.name)+'</strong><div class="muted small">'+esc(c.email)+'</div><div class="small">'+(c.share_progress===true?'✓ Comparte constancia':c.share_progress===fal function calendarView(){let [year,month]=S.month.split('-').map(Number),first=new Date(year,month-1,1).getDay(),offset=(first+6)%7,days=new Date(year,month,0).getDate();let cells=Array.from({length:offset},()=>'<div></div>').concat(Array.from({length:days},(_,i)=>{let day=S.month+'-'+String(i+1).padStart(2,'0');let st=state(day);return '<button class="day '+(S.day===day?'sel':'')+'" onclick="S.day=\''+day+'\';render()"><small>'+String(i+1)+'</small><span class="star '+st+'">'+star(st)+'</span></button>'}));let rows=planned(S.day);return '<div class="eyebrow">TU PROGRESO</div><h1>Calendario de hábitos</h1><div class="grid"><div class="card"><div class="row between" style="margin-bottom:16px"><h2>'+new Date(year,month-1,1).toLocaleDateString('es',{month:'long',year:'numeric'})+'</h2><div><button class="btn secondary tiny" onclick="shiftMonth(-1)">‹</button> <button class="btn secondary tiny" onclick="shiftMonth(1)">›</button></div></div><div class="calgrid">'+['L','M','M','J','V','S','D'].map(d=>'<div class="small muted" style="text-align:center">'+d+'</div>').join('')+cells.join('')+'</div><div class="divider"></div><div class="small muted">★ Completo · ◐ Parcial · ☆ Sin cumplir · – Neutro</div></div><div class="card"><h2>'+new Date(S.day+'T12:00:00').toLocaleDateString('es',{weekday:'long',day:'numeric',month:'long'})+'</h2><span class="pill">'+star(state(S.day))+' '+percent(rows)+'% completado</span><div class="divider"></div>'+(rows.length?rows.map(r=>'<div class="record"><div class="grow"><strong>'+esc(r.name)+'</strong><div class="muted small">'+esc(r.time)+' · '+esc(r.servings)+' '+esc(r.units)+'</div></div><span class="pill '+(r.event?.status==='taken'?'':'warn')+'">'+(r.event?.status==='taken'?'✓':r.event?.status==='missed'?'X':'Pendiente')+'</span><button class="btn secondary tiny" onclick="take(\''+r.id+'\',\''+r.time+'\',\''+(r.event?.status==='taken'?'undo':'taken')+'\',\''+S.day+'\')">'+(r.event?.status==='taken'?'Corregir':'Apelar / confirmar')+'</butto function achievementView(){let dates=Array.from(new Set(S.events.map(e=>e.day))).sort(),full=dates.filter(d=>state(d)==='full').length,partial=dates.filter(d=>state(d)==='partial').length;let max=0,streak=0;for(const d of dates){if(['full','partial'].includes(state(d))){streak++;max=Math.max(max,streak)}else streak=0}return '<div class="eyebrow">CELEBRA TUS AVANCES</div><h1>Mis logros</h1><div class="grid3">'+[['⭐',full,'Días completos'],['🌗',partial,'Días parciales'],['🔥',max,'Mejor racha registrada']].map(x=>'<div class="card"><div style="font-size:33px">'+x[0]+'</div><div class="stat">'+x[1]+'</div><div class="muted small">'+x[2]+'</div></div>').join('')+'</div><div class="card" style="margin-top:18px"><h2>Insignias de constancia</h2><div class="grid3">'+[7,15,30,60,90].map(n=>'<div class="card" style="text-align:center"><div style="font-size:36px">'+(max>=n?'🏅':'🔒')+'</div><strong>'+n+' días</strong><div class="muted small">'+(max>=n?'Desbloqueado':'Por conseguir')+'</div></div>').join('')+'</div></div>'}

function take(assignment,time,status,day=today()){let a=S.assignments.find(a=>a.id===assignment);if(!a)return;if(status==='undo'){modal('<h2>¿Quieres corregir esta toma?</h2><p class="muted">Tu inventario debe representar lo que realmente consumiste. ¿No la tomaste, la tomarás más tarde o la marcaste por error?</p><p class="small">Al confirmar, se devuelve la cantidad correspondiente a tu inventario.</p><div class="row"><button class="btn secondary" onclick="closeModal()">Cancelar</button><button class="btn" onclick="confirmTake(\''+assignment+'\',\''+time+'\',\'undo\',\''+day+'\',false)">Sí, corregir</button></div>');return}let appealed=day<today();modal('<h2>'+(appealed?'Apelar toma omitida':'¿Ya tomaste tu suplemento?')+'</h2><p class="muted">'+esc(a.name)+' · '+esc(time)+' · '+esc(day)+'</p><p>'+(appealed?'Al confirmar bajo tu compromiso personal que realmente lo consumiste, recuperaremos tu progreso y actualizaremos el inventario.':'Confirma únicamente si ya lo consumiste. Tu constancia la construyes tú.')+'</p><div class="row"><button class="btn secondary" onclick="closeModal()">Volver</button><button class="btn" onclick="confirmTake(\''+assignment+'\',\''+time+'\',\'taken\',\''+day+'\','+appealed+')">Sí, lo tomé</button></div>')}

function closeModal(){document.querySelector('.modal')?.remove()}
async function confirmTake(assignment,time,status,day,appeal){closeModal();await action(async()=>{await api('take',{assignment,time,status,day,appeal});let prior=planned(today());let was=prior.length>0&&prior.every(x=>x.event?.status==='taken');let dash=await api('dashboard');S.assignments=dash.assignments;S.events=dash.events;render();let now=planned(today());if(!was&&now.length&&now.every(x=>x.event?.status==='taken')&&status==='taken')modal('<div style="text-align:center;font-size:60px">🏆🌟</div><h2 style="text-align:center">¡Día completado!</h2><p style="text-align:center">¡Excelente! Cada día de constancia cuenta.</p><button class="btn full" onclick="closeModal()">¡Genial!</button>');else toast(status==='undo'?'Marcación corregida e inventario actualizado':'¡Toma registrada!')})}
function editSchedule(id){let a=S.assignments.find(x=>x.id===id);if(!a)return;modal('<h2>Personalizar mis horarios</h2><p class="muted small">'+esc(a.name)+' · Los cambios se aplican a las próximas tomas.</p><form class="form" id="scheduleform"><label class="field">Horarios separados por coma<input name="times" required value="'+esc(a.times.join(', '))+'"></label><label class="field">Tolerancia (minutos)<input name="tolerance" type="number" min="0" max="180" value="'+a.tolerance+'"></label><div class="field">Días de la semana<div class="checkboxes">'+['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'].map((d,i)=>'<label><input type="checkbox" name="day" value="'+i+'" '+(a.daily_days.includes(i)?'checked':'')+'> '+d+'</label>').join('')+'</div></div><button class="btn">Guardar horario</button></form>');$('#scheduleform').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);action(async()=>{await api('schedule',{assignment:id,times:f.get('times').split(',').map(x=>x.trim()),tolerance:Number(f.get('tolerance')),days:f.getAll('day').map(Number)});closeModal();let dash=await api('dashboard');S.assignments=dash.assignments;S.events=dash.events;render();toast('Horarios actualizados')})}}
async function toggleClient(email,active){await action(async()=>{await api('activate',{email,active});await reloadSeller();toast(active?'Cliente activado':'Cliente desactivado')})}
async function reloadSeller(){let d=await api('clients');S.clients=d.clients;S.stock=d.stock;render()}
document.addEventListener('submit',e=>{if(!['activate','assign','newproduct'].includes(e.target.id))return;e.preventDefault();let op={activate:'activate',assign:'assign',newproduct:'product'}[e.target.id];let data=Object.fromEntries(new FormData(e.target));action(async()=>{if(op==='activate')data.active=true;await api(op,data);if(op==='product')S.products=(await api('catalog')).products;else await reloadSeller();render();toast(op==='activate'?'Cliente activado':op==='assign'?'Inventario guardado':'Producto añadido')})});
function canMotion(){return !!window.gsap&&!window.matchMedia('(prefers-reduced-motion: reduce)').matches}
function motionIn(){const slot=document.querySelector('.df-bits-slot');if(slot&&window.DosiFeelBits){window.DosiFeelBits.mount(slot,{taken:Number(slot.dataset.taken),total:Number(slot.dataset.total)})}if(!canMotion())return;gsap.fromTo('.shell .hero, .shell .grid>.card, .shell .grid>.gap>.card, .shell .grid3>.card',{opacity:0,y:14},{opacity:1,y:0,duration:.42,stagger:.055,ease:'power2.out',clearProps:'all'});}
window.addEventListener('unhandledrejection',e=>toast(e.reason?.message||'Error inesperado'));load();
</script></body></html>
